- title: "Intro to pdb, or: How I Found a Bug in Requests"
  description: >
    Talk at the local Python Buffalo meetup covering basic debugging using the Python
    debugger (pdb) without an IDE, as well as some more efficient debugging with the
    more feature-rich iPython debugger (ipdb). Mixes in a little HTTP troubleshooting
    to show how a bug was found in the popular Python Requests module.
  url: https://www.meetup.com/Python-Buffalo/events/243473519/
  slides: https://www.jessejoe.com/other/intro_to_pdb/slides/
